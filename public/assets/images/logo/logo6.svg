      .brand-text {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        fill: #183B9B;
        letter-spacing: -0.02em;
      }
    </style>
  </defs>

  <g transform="translate(40, 25)">
