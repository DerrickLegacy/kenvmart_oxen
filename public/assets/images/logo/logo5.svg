<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 200" width="100%" height="100%">
  <defs>
    <style>
      .brand-title {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
        font-weight: 800;
        fill: #183B9B;
      }
      .brand-subtitle {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
        font-weight: 700;
        fill: #183B9B;
        letter-spacing: 0.32em;
      }
    </style>
  </defs>

  <!-- Total height for both Bag & Text: 140px (from Y = 30 to Y = 170) -->
  <g id="logo-group">
    <!-- Bag Handle (Outer top stroke at Y=30) -->
    <path d="M 115,75 V 52 C 115,37 125,37 140,37 C 155,37 165,37 165,52 V 75"
          fill="none" stroke="#183B9B" stroke-width="14" stroke-linecap="round"/>

    <!-- Bag Body (Outer bottom edge at Y=170) -->
    <path d="M 92,72 C 92,65 100,60 110,60 L 170,60 C 180,60 188,65 188,72 L 178,162 C 176,168 168,170 158,170 L 122,170 C 112,170 104,168 102,162 Z"
          fill="#183B9B"/>

    <!-- Rivets -->
    <circle cx="118" cy="92" r="9" fill="#FFFFFF"/>
    <circle cx="162" cy="92" r="9" fill="#FFFFFF"/>

    <!-- Text Block (Top of K at Y=30, Bottom of STORES at Y=170) -->
    <text x="215" y="112" class="brand-title" font-size="95">Kenvi</text>
    <text x="218" y="170" class="brand-subtitle" font-size="40">STORES</text>
  </g>
</svg>
